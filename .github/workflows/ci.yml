name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # puppeteer is only needed by the manual e2e workflow; skip its
      # Chromium download so the required check job stays fast.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: select-to-ai-extension
          path: dist/select-to-ai-extension.zip
          if-no-files-found: error
