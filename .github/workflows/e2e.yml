name: E2E, headed and slow

# Manual only. The agent scenarios in a visible browser under xvfb (the
# browser job in ci.yml runs the same scenarios headless), and the recipes
# benchmark's check that no degenerate policy can pass it, which runs every
# degenerate adapter over the dev mutation set and takes several minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx puppeteer browsers install chrome
      - run: npx playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run --auto-servernum npm run test:v4
        env:
          E2E_HEADFUL: "1"
      - run: node --test tests/recipes/degenerate.test.js
