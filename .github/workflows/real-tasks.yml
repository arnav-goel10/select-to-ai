name: Real-task trial

# The agent on many ordinary tasks, on live public sites, in the packed build.
# Run by hand (Actions, "Real-task trial", Run workflow). How to run it and
# how to read the results: docs/real-task-trial.md.
#
# Keys come from repository secrets only and are never printed:
#   BENCH_API_KEY    the agent's provider key (required for a real run)
#   BENCH_JUDGE_KEY  the judge's key (optional; BENCH_API_KEY is used without it)
# and one optional repository variable, BENCH_JUDGE_URL, for a judge on
# another OpenAI-compatible endpoint.
#
# Dry mode needs no secret: the scripted model in tests/e2e/server.js plays
# seven fixture tasks and the same artifacts and summary are produced. It runs
# when the dry box is ticked, when BENCH_API_KEY is not set, and on every push
# to the branch this workflow was written on, which never touches a secret.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "everyday: tests/bench/everyday-tasks.json (93 tasks). dev: tests/bench/smoke-tasks.json (12 tasks)"
        type: choice
        options: [everyday, dev]
        default: everyday
      arm:
        description: "shipped: the packed 4.0 build as it is (no debugger). debugger-on: the same build with the debugger permission added"
        type: choice
        options: [shipped, debugger-on]
        default: shipped
      provider:
        description: Provider id the agent runs on (extension/defaults.js PROVIDER_ENDPOINTS)
        type: string
        default: anthropic
      model:
        description: The agent's model
        type: string
        default: claude-haiku-5-5
      judge_model:
        description: The judge's model (a different one from the agent's)
        type: string
        default: claude-sonnet-5-5
      shards:
        description: Browsers in parallel, one job each (1 to 12)
        type: string
        default: "6"
      limit:
        description: "How many tasks, spread evenly over the families (all, or a number)"
        type: string
        default: all
      max_usd:
        description: Hard spend cap in US dollars, agent and judge together
        type: string
        default: "5"
      dry:
        description: Dry mode (scripted model, fixture pages, no keys, no spend)
        type: boolean
        default: false
  push:
    branches: [rel40-real-tasks]

permissions:
  contents: read

# With pipefail, so a failed check behind a pipe fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: real-tasks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dry: ${{ steps.plan.outputs.dry }}
      suite: ${{ steps.plan.outputs.suite }}
      arm: ${{ steps.plan.outputs.arm }}
      tasks: ${{ steps.plan.outputs.tasks }}
      sample: ${{ steps.plan.outputs.sample }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      cap_per_shard: ${{ steps.plan.outputs.cap_per_shard }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Work out what to run
        # Inputs reach the script as environment values, never as script text.
        env:
          EVENT: ${{ github.event_name }}
          IN_DRY: ${{ inputs.dry }}
          IN_SUITE: ${{ inputs.suite }}
          IN_ARM: ${{ inputs.arm }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_MAX_USD: ${{ inputs.max_usd }}
          # Only asked whether it is set; the value is not used in this job.
          HAS_KEY: ${{ secrets.BENCH_API_KEY != '' }}
        run: |
          dry=false
          why=""
          if [ "$EVENT" != "workflow_dispatch" ]; then dry=true; why="a push runs dry mode only"; fi
          if [ "$IN_DRY" = "true" ]; then dry=true; why="the dry box was ticked"; fi
          if [ "$dry" = "false" ] && [ "$HAS_KEY" != "true" ]; then dry=true; why="the repository has no BENCH_API_KEY secret"; fi

          suite="${IN_SUITE:-everyday}"
          arm="${IN_ARM:-shipped}"
          shards="${IN_SHARDS:-6}"
          limit="${IN_LIMIT:-all}"
          cap="${IN_MAX_USD:-5}"
          case "$suite" in everyday) tasks=tests/bench/everyday-tasks.json ;; dev) tasks=tests/bench/smoke-tasks.json ;; *) echo "suite must be everyday or dev"; exit 1 ;; esac
          case "$arm" in shipped|debugger-on) ;; *) echo "arm must be shipped or debugger-on"; exit 1 ;; esac
          echo "$shards" | grep -Eq '^[0-9]+$' || { echo "shards must be a whole number"; exit 1; }
          if [ "$shards" -lt 1 ] || [ "$shards" -gt 12 ]; then echo "shards must be 1 to 12"; exit 1; fi
          echo "$cap" | grep -Eq '^[0-9]+(\.[0-9]+)?$' || { echo "max_usd must be a number of US dollars"; exit 1; }
          awk "BEGIN { exit !($cap > 0) }" || { echo "max_usd must be more than 0: a real run always has a cap"; exit 1; }
          sample=0
          if [ "$limit" != "all" ]; then
            echo "$limit" | grep -Eq '^[1-9][0-9]*$' || { echo "limit must be all or a whole number"; exit 1; }
            sample="$limit"
          fi

          if [ "$dry" = "true" ]; then
            suite=fixture
            tasks=tests/bench/fixture-tasks.json
            shards=2
            sample=0
            cap=2
          fi
          total=$(node -e "console.log(require('./tests/bench/judge.js').normaliseTasks(require('./' + process.argv[1])).length)" "$tasks")
          count="$total"
          if [ "$sample" -gt 0 ] && [ "$sample" -lt "$total" ]; then count="$sample"; fi
          if [ "$shards" -gt "$count" ]; then shards="$count"; fi
          list=$(node -e "console.log(JSON.stringify(Array.from({ length: Number(process.argv[1]) }, (_, i) => i + 1)))" "$shards")
          per=$(awk "BEGIN { printf \"%.4f\", $cap / $shards }")

          {
            echo "dry=$dry"
            echo "suite=$suite"
            echo "arm=$arm"
            echo "tasks=$tasks"
            echo "sample=$sample"
            echo "shards=$list"
            echo "shard_count=$shards"
            echo "cap_per_shard=$per"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo ""
            if [ "$dry" = "true" ]; then echo "Dry mode ($why): scripted model, fixture pages, no key is read and nothing is spent."; fi
            echo "$count task(s) from \`$tasks\`, arm \`$arm\`, $shards shard(s), spend cap \$$cap (\$$per per shard)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The task files are sound
        run: node tests/bench/trial.js validate tests/bench/everyday-tasks.json && node tests/bench/trial.js validate tests/bench/fixture-tasks.json

  # The packed 4.0 zip, built and checked the way ci.yml's package-integrity job does it.
  build:
    name: build the packed zip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package-extension.mjs
      - id: meta
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          artifact="select-to-ai-${version}.zip"
          cp dist/select-to-ai-extension.zip "dist/${artifact}"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"
      - run: node scripts/check-package.mjs "dist/${{ steps.meta.outputs.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/${{ steps.meta.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

  run:
    name: tasks (shard ${{ matrix.shard }} of ${{ needs.plan.outputs.shard_count }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx puppeteer browsers install chrome
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
      - run: mkdir -p build && unzip -q "${{ needs.build.outputs.artifact }}" -d build
      - name: Run the tasks
        env:
          BENCH_DRY: ${{ needs.plan.outputs.dry == 'true' && '1' || '' }}
          BENCH_EXTENSION: build
          BENCH_TASKS: ${{ needs.plan.outputs.tasks }}
          BENCH_SAMPLE: ${{ needs.plan.outputs.sample }}
          BENCH_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
          BENCH_OUT: tests/bench/out/trial
          BENCH_DEBUGGER: ${{ needs.plan.outputs.arm == 'debugger-on' && 'on' || '' }}
          BENCH_MAX_USD: ${{ needs.plan.outputs.cap_per_shard }}
          BENCH_TIMEOUT_S: ${{ needs.plan.outputs.dry == 'true' && '40' || '300' }}
          BENCH_PROVIDER: ${{ inputs.provider || 'anthropic' }}
          BENCH_MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}
          BENCH_JUDGE_MODEL: ${{ inputs.judge_model || 'claude-sonnet-5-5' }}
          BENCH_JUDGE_URL: ${{ vars.BENCH_JUDGE_URL }}
          # Dry mode is given no key at all.
          BENCH_API_KEY: ${{ needs.plan.outputs.dry != 'true' && secrets.BENCH_API_KEY || '' }}
          BENCH_JUDGE_KEY: ${{ needs.plan.outputs.dry != 'true' && secrets.BENCH_JUDGE_KEY || '' }}
        run: node tests/bench/run.js
      # Per task: run.json (steps, outcome, verdict, cost, time, failure, counters), log.txt and the screenshots.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-shard-${{ matrix.shard }}
          path: tests/bench/out/trial
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: summary
    needs: [plan, run]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: trial-shard-*
          path: tests/bench/out/trial
          merge-multiple: true
      - name: Table by family
        env:
          TASKS: ${{ needs.plan.outputs.tasks }}
          SAMPLE: ${{ needs.plan.outputs.sample }}
          SUITE: ${{ needs.plan.outputs.suite }}
          ARM: ${{ needs.plan.outputs.arm }}
          DRY: ${{ needs.plan.outputs.dry }}
        run: |
          mkdir -p tests/bench/out/trial
          check=""
          if [ "$DRY" = "true" ]; then check="--check-dry"; fi
          node tests/bench/trial.js summary tests/bench/out/trial --tasks "$TASKS" --sample "$SAMPLE" --suite "$SUITE" --arm "$ARM" --commit "$GITHUB_SHA" $check | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-summary
          path: tests/bench/out/trial/trial-summary.json
          if-no-files-found: warn
          retention-days: 30
