<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Select to AI</title>
    <link rel="stylesheet" href="tokens.css">
    <style>
        body {
            font-family: var(--font-sans);
            width: 280px;
            padding: var(--space-4);
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
        }

        h1 {
            margin: 0 0 var(--space-4) 0;
            font-size: 15px;
            font-weight: 600;
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Launcher buttons */
        .launcher-btn {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: var(--space-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            transition: background 0.15s, border-color 0.15s;
        }

        .launcher-btn:hover {
            background: var(--surface-2);
            border-color: var(--border-strong);
        }

        .launcher-btn .icon {
            color: var(--accent);
        }

        .launcher-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-contrast);
        }

        .launcher-btn.primary .icon {
            color: var(--accent-contrast);
        }

        .launcher-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .launcher-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin: -4px 0 var(--space-2) 0;
            padding-left: 2px;
            line-height: 1.35;
        }

        .divider {
            border-top: 1px solid var(--border);
            margin: var(--space-3) 0;
        }

        .field-row {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .field-row label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
        }

        select {
            width: 100%;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 13px;
        }

        .footer-note {
            margin-top: var(--space-3);
            font-size: 10.5px;
            color: var(--text-muted);
            text-align: center;
        }

        /* Theme toggle (sun/moon) */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            border-radius: var(--radius-sm);
            color: var(--text);
            line-height: 0;
        }

        .sun-and-moon> :is(.moon, .sun, .sun-beams) {
            transform-origin: center center;
        }

        .sun-and-moon> :is(.moon, .sun) {
            fill: var(--text);
        }

        .theme-toggle:is(:hover, :focus-visible)>.sun-and-moon> :is(.moon, .sun) {
            fill: var(--accent);
        }

        .sun-and-moon>.sun-beams {
            stroke: var(--text);
            stroke-width: 2px;
        }

        .theme-toggle:is(:hover, :focus-visible) .sun-and-moon>.sun-beams {
            stroke: var(--accent);
        }

        [data-theme="dark"] .sun-and-moon>.sun {
            transform: scale(1.75);
        }

        [data-theme="dark"] .sun-and-moon>.sun-beams {
            opacity: 0;
        }

        [data-theme="dark"] .sun-and-moon>.moon>circle {
            transform: translateX(-7px);
        }

        @supports (cx: 1) {
            [data-theme="dark"] .sun-and-moon>.moon>circle {
                transform: translateX(0);
                cx: 17;
            }
        }

        .sun-and-moon>.sun {
            transition: transform .5s cubic-bezier(.5, 1.25, .75, 1.25);
        }

        .sun-and-moon>.sun-beams {
            transition: transform .5s cubic-bezier(.5, 1.5, .75, 1.25), opacity .5s cubic-bezier(.25, 0, .3, 1);
        }

        .sun-and-moon .moon>circle {
            transition: transform .25s cubic-bezier(0, 0, 0, 1);
        }

        @supports (cx: 1) {
            .sun-and-moon .moon>circle {
                transition: cx .25s cubic-bezier(0, 0, 0, 1);
            }
        }

        /* Tooltip */
        .tooltip-container {
            display: inline-flex;
            align-items: center;
            margin-left: 6px;
            position: relative;
        }

        .info-icon {
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            cursor: help;
            transition: color 0.2s;
        }

        .info-icon:hover {
            color: var(--text);
        }

        .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            text-align: center;
            border-radius: var(--radius-sm);
            padding: 8px;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(5px);
            font-size: 12px;
            font-weight: normal;
            line-height: 1.4;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }

        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <h1>
        Select to AI
        <button class="theme-toggle" id="theme-toggle" title="Toggle light and dark theme" aria-label="Toggle color theme"
            aria-live="polite">
            <svg class="sun-and-moon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24">
                <mask class="moon" id="moon-mask">
                    <rect x="0" y="0" width="100%" height="100%" fill="white" />
                    <circle cx="24" cy="10" r="6" fill="black" />
                </mask>
                <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor" />
                <g class="sun-beams" stroke="currentColor">
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </g>
            </svg>
        </button>
    </h1>

    <button id="openSidebarBtn" class="launcher-btn primary">
        <span class="icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="9" y1="3" x2="9" y2="21" />
            </svg>
        </span>
        Open Sidebar
    </button>

    <button id="openAgentBtn" class="launcher-btn">
        <span class="icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
            </svg>
        </span>
        <span id="openAgentLabel">Open Browser Agent</span>
    </button>
    <div class="launcher-hint u-hidden" id="agentDisabledHint">
        The browser agent is off. Opening Settings lets you enable it and add an API key.
    </div>

    <button id="openOptionsBtn" class="launcher-btn">
        <span class="icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
        </span>
        Settings
    </button>

    <div class="divider" role="presentation"></div>

    <div class="field-row">
        <label for="openingMode">
            Opening mode
            <span class="tooltip-container" tabindex="0" aria-label="Opening mode help">
                <svg class="info-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                </svg>
                <span class="tooltip-text">Choose whether assistants open in the sidebar or a new tab.</span>
            </span>
        </label>
        <select id="openingMode" aria-label="Assistant opening mode">
            <option value="sidePanel">Sidebar</option>
            <option value="tab">New Tab</option>
        </select>
    </div>

    <div class="footer-note">
        Service shortcuts and behavior live in <strong>Settings</strong>.
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>

</html>
