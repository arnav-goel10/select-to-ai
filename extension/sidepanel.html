<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Select to AI Sidebar</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="ui.css">
    <style>
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Shown only while an assistant site is in the panel: the way back
           to the agent, the site picker, and "send this page's address". */
        .sp-bar {
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .sp-bar .grow { flex: 1; }

        .sp-bar select.input {
            height: 30px;
            font-weight: var(--weight-medium);
            border-radius: var(--radius-full);
            padding-left: 12px;
        }

        .sp-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px 16px;
            text-align: center;
            color: var(--text-muted, var(--text));
            background: var(--bg);
        }

        .sp-empty[hidden] { display: none; }

        .sp-empty h1 {
            margin: 0;
            font-size: 15px;
            font-weight: var(--weight-medium);
            color: var(--text);
        }

        .sp-empty p {
            margin: 0;
            max-width: 280px;
            font-size: 13px;
            line-height: 1.5;
        }

        iframe[hidden] { display: none; }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--bg);
        }
    </style>
</head>

<body>
    <header class="sp-bar" id="spBar" hidden>
        <button type="button" class="btn btn-ghost btn-sm" id="backToAgentBtn" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Agent
        </button>
        <span class="grow"></span>
        <select id="serviceSelector" class="input" aria-label="Choose which assistant the side panel shows"></select>
        <button id="redoContextBtn" class="icon-btn" title="Send this page's address to the assistant" aria-label="Send this page's address to the assistant">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </button>
    </header>
    <section class="sp-empty" id="emptyState" hidden aria-live="polite">
        <h1>No assistant is turned on</h1>
        <p>Turn on ChatGPT, Gemini, Perplexity or Claude in Settings, and the side panel shows it here.</p>
        <button type="button" class="btn btn-primary btn-sm" id="emptyStateSettings">Open Settings</button>
    </section>
    <iframe id="contentFrame" src="about:blank" title="Select to AI"></iframe>
    <script src="config.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
